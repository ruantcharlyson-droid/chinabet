services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: chinabet
      POSTGRES_USER: chinabet
      POSTGRES_PASSWORD: chinabet
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
  migrate:
    build: ./backend
    command: python /app/../database/migrate.py
    environment:
      DATABASE_URL: postgresql+psycopg2://chinabet:chinabet@db:5432/chinabet
    volumes: ["./database:/database:ro"]
    depends_on: [db]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://chinabet:chinabet@db:5432/chinabet
      ALLOWED_ORIGINS: http://localhost:8080
      SANDBOX_MODE: "true"
      APP_ENV: development
    depends_on: [db]
    ports: ["8000:8000"]
  frontend:
    image: nginx:alpine
    volumes: ["./frontend:/usr/share/nginx/html:ro"]
    ports: ["8080:80"]
    depends_on: [backend]
volumes:
  pgdata:
